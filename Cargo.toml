[workspace]
resolver = "2"
members = ["crates/clave"]

[workspace.dependencies]
wist-core = { path = "../core/crates/wist-core" }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
parquet = { version = "56", default-features = false }
base64 = "0.22"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3
